name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "node-studio-v*"

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: node-studio/packaging/requirements-build.txt
      - name: Build and test
        shell: powershell
        working-directory: node-studio
        run: ./packaging/build-windows.ps1 -PythonExecutable python
      - name: Verify PE and smoke start
        shell: powershell
        working-directory: node-studio
        run: |
          $exe = "dist/dafeiyu-node-studio.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Not a Windows PE file" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw "Missing PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -notin @(0x8664, 0x14c)) { throw "Unexpected PE machine: $machine" }
          $actualHash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $sidecarHash = ((Get-Content "$exe.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actualHash -ne $sidecarHash) { throw "SHA256 sidecar mismatch" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser --port 18765" -PassThru
          try {
            $ready = $false
            1..40 | ForEach-Object {
              Start-Sleep -Milliseconds 250
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/node-types" -TimeoutSec 1
                if ($response.nodeTypes.Count -eq 12) { $ready = $true }
              } catch {}
              if ($ready) { return }
            }
            if (-not $ready) { throw "EXE smoke test failed" }
            $root = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18765/" -TimeoutSec 2
            if ($root.StatusCode -ne 200 -or $root.Content -notmatch 'id="graph"') { throw "Root page smoke failed" }
            foreach ($asset in @("/static/app.js", "/static/styles.css")) {
              if ((Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18765$asset" -TimeoutSec 2).StatusCode -ne 200) { throw "Asset smoke failed: $asset" }
            }
            $graphs = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/graphs" -TimeoutSec 2
            if ($graphs.graphs.Count -ne 3) { throw "Graph bundle smoke failed" }
            $sessionResponse = Invoke-WebRequest -UseBasicParsing -SessionVariable webSession -Uri "http://127.0.0.1:18765/api/session" -TimeoutSec 2
            $csrf = ($sessionResponse.Content | ConvertFrom-Json).csrfToken
            $graph = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/graphs/01-basic-chat.json" -TimeoutSec 2
            $headers = @{ "X-Node-Studio-CSRF" = $csrf; "Origin" = "http://127.0.0.1:18765" }
            $created = Invoke-RestMethod -WebSession $webSession -Method Post -ContentType "application/json" -Headers $headers -Uri "http://127.0.0.1:18765/api/runs" -Body (@{graph=$graph} | ConvertTo-Json -Depth 30)
            $record = Invoke-RestMethod -WebSession $webSession -Uri "http://127.0.0.1:18765/api/runs/$($created.runId)" -TimeoutSec 2
            if ($record.status -ne "success") { throw "Run smoke failed" }
          } finally {
            Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if (-not $proc.WaitForExit(5000)) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "SHA256: $actualHash"
      - uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-node-studio-windows
          if-no-files-found: error
          path: |
            node-studio/dist/dafeiyu-node-studio.exe
            node-studio/dist/dafeiyu-node-studio.exe.sha256
