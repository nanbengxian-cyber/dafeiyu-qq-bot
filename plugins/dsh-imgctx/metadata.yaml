name: dsh-imgctx
desc: 让机器人「看得见」群里的图片。框架只转述当前消息自带的图片、且遇到动图必然失败（视觉模型不吃 GIF），导致群里「先发图后提问」和绝大多数表情包模型都看不到。本插件在 on_llm_request 时补两条路：① 回看最近几条群消息里的图；② 框架转述失败时用它落好盘的本地文件兜底。动图抽 4 帧拼图后识别，同图只转述一次。2026-09-13 起按「这张图是不是本轮要回答的东西」分阻塞：当前消息自带图和用户精确引用的图照旧等到转述完，历史里顺带的图只吃缓存、其余后台预转述（下一轮白拿）——实测被@的纯文字回复夹了识图中位 25.8s、没夹 8.6s，这一刀把 17 秒还回去。提供 /图片上下文 查看策略。
version: 1.2.0
author: 大肥鱼
repo: local
