name: dsh-will
desc: 意志的执行层（被踩线时真的做点什么，而不是只说点什么）。拿今天群里 37 条真实消息回放旧判据：傻/滚/闭嘴/妈妈/狗修金/内裤送我全部落 ordinary，407 次注入里真拒绝 0 次，而且五个行为全是往 prompt 里塞话、没有任何输出侧动作。本插件不注入任何东西，只在出口真的做一件事——不回/短回/顶回去；脾气有两个来源：被踩线（贬损/角色指派/性骚扰/使唤/反复索取）与被当空气（dsh-effect 的连续被无视）。事实、安全、权限与工具任务永远照办，群主与管理员永不被沉默，一切异常一律放行。群主命令 /脾气。
author: 大肥鱼
version: 1.0.0
